server:
  port: 8761  # ??????????? ???? ??? Eureka

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:

    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:

    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info