spring:
  application:
    name: user-service

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: sultan.org.userservice.ratingsummary.kafka.RatingEvent

  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${REALM_URL}

keycloak:
  baseUrl: ${KEYCLOAK_BASE_URL}
  realm: ${KEYCLOAK_REALM}
  clientUser:
    id: ${KEYCLOAK_USER_CLIENT_ID}
    secret: ${KEYCLOAK_USER_CLIENT_SECRET}
  clientAdmin:
    id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    username: ${KEYCLOAK_ADMIN_USERNAME}
    password: ${KEYCLOAK_ADMIN_PASSWORD}
server:
  port: 8081  # Уникальный порт для каждого сервиса
minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: users


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info

